openapi: 3.0.3
info:
  title: Api-SportMatch
  description: >
    API REST de SportMatch. Incluye subida de archivos (imágenes, videos, PDF, GPX y audio) en /api/archivos.
    Fase 2: autenticación, usuarios y administradores.
    Fase 3 (en construcción): deportes, cuestionario de registro, eventos,
    inscripciones y valoraciones, organizadores y validación, administración
    y soporte. Ver /docs/entidades_completas.md en el repositorio para el
    catálogo completo de las 89 entidades del modelo.
  version: 0.5.0
servers:
  - url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Usuario:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre_completo: { type: string, example: "Ana Pérez" }
        correo: { type: string, example: "ana@correo.com" }
        nombre_usuario: { type: string, example: "anaperez" }
        rol: { type: string, enum: [usuario, organizador, administrador], example: "usuario" }
        estado_cuenta: { type: string, enum: [pendiente_verificacion, activa, suspendida, eliminada], example: "activa" }
        telefono: { type: string, pattern: '^[0-9]{7,15}$', example: "5512345678" }
        ciudad: { type: object, nullable: true }
        creado_en: { type: string, format: date-time, example: "2026-05-10T14:30:00" }
    Perfil:
      type: object
      description: Datos del perfil (tabla `perfiles`). Su llave es el usuario_id. `visibilidad_*`, `quien_puede_escribir` y `aparecer_en_cercanos` solo los ve su dueño; la ubicación solo la ve quien `visibilidad_ubicacion` permita.
      properties:
        usuario_id: { type: integer, example: 1 }
        biografia: { type: string, nullable: true, maxLength: 500, example: "Corro los fines de semana y me encanta el trail" }
        avatar_id: { type: integer, nullable: true, example: 1 }
        avatar_url: { type: string, nullable: true, example: "/static/uploads/imagen/3f2a9c1e5b7d4a8f9e0c1d2b3a4f5e6d.png" }
        portada_id: { type: integer, nullable: true, example: 2 }
        portada_url: { type: string, nullable: true, example: "/static/uploads/imagen/9b1d7e4c2a6f4c8d8e3f5a7b9c1d2e4f.png" }
        visibilidad_perfil: { type: string, enum: [publico, amigos, privado], example: "publico" }
        visibilidad_ubicacion: { type: string, enum: [publico, amigos, privado], example: "amigos" }
        quien_puede_escribir: { type: string, enum: [publico, amigos, privado], example: "publico" }
        aparecer_en_cercanos: { type: boolean, example: true }
        latitud: { type: number, nullable: true, example: 19.2826 }
        longitud: { type: number, nullable: true, example: -99.6557 }
        ubicacion_actualizada_en: { type: string, format: date-time, nullable: true, example: "2026-10-13T14:30:00" }
        actualizado_en: { type: string, format: date-time, example: "2026-10-13T14:30:00" }
    PerfilCompleto:
      description: Lo que ve el dueño del perfil (o un admin) - los datos de su cuenta más su perfil y sus deportes.
      allOf:
        - { $ref: "#/components/schemas/Usuario" }
        - type: object
          properties:
            perfil: { $ref: "#/components/schemas/Perfil" }
            deportes: { type: array, items: { $ref: "#/components/schemas/UsuarioDeporte" } }
            contadores: { $ref: "#/components/schemas/Contadores" }
            relacion: { $ref: "#/components/schemas/Relacion" }
    Contadores:
      type: object
      properties:
        seguidores: { type: integer, example: 12 }
        siguiendo: { type: integer, example: 8 }
        amigos: { type: integer, example: 5 }
    Relacion:
      type: object
      nullable: true
      description: Cómo se relaciona quien consulta con ese usuario, para saber qué botón mostrar. Es `null` si no hay sesión o es mi propio perfil.
      properties:
        yo_sigo: { type: boolean, example: true }
        me_sigue: { type: boolean, example: false }
        amistad: { type: string, enum: [ninguna, solicitud_enviada, solicitud_recibida, aceptada], example: "ninguna" }
        amistad_id: { type: integer, nullable: true, example: null, description: "Id de la solicitud/amistad (sirve para aceptarla o cancelarla)." }
    TarjetaUsuario:
      type: object
      description: Datos mínimos y públicos de un usuario en un listado.
      properties:
        id: { type: integer, example: 2 }
        nombre_completo: { type: string, example: "Luis Gómez" }
        nombre_usuario: { type: string, example: "luisg" }
        avatar_url: { type: string, nullable: true, example: "/static/uploads/imagen/3f2a9c1e5b7d4a8f9e0c1d2b3a4f5e6d.png" }
    Amistad:
      type: object
      properties:
        id: { type: integer, example: 1 }
        usuario_id: { type: integer, example: 1, description: "Quien envió la solicitud." }
        amigo_id: { type: integer, example: 3, description: "Quien la recibió." }
        estado: { type: string, enum: [pendiente, aceptada, rechazada], example: "pendiente" }
        creado_en: { type: string, format: date-time, example: "2026-10-19T14:30:00" }
        respondida_en: { type: string, format: date-time, nullable: true, example: null }
    PerfilPublico:
      type: object
      description: Lo que ve un tercero. Nunca incluye correo, teléfono, fecha de nacimiento, sexo ni rol.
      properties:
        id: { type: integer, example: 1 }
        nombre_completo: { type: string, example: "Ana Pérez" }
        nombre_usuario: { type: string, example: "anaperez" }
        ciudad: { type: object, nullable: true }
        perfil: { $ref: "#/components/schemas/Perfil" }
        deportes: { type: array, items: { $ref: "#/components/schemas/UsuarioDeporte" } }
        contadores: { $ref: "#/components/schemas/Contadores" }
        relacion: { $ref: "#/components/schemas/Relacion" }
    Archivo:
      type: object
      description: Archivo ya subido con POST /api/archivos. Su `id` es lo que se manda como portada_id, logo_id, gpx_archivo_id o archivo_id.
      properties:
        id: { type: integer, example: 1 }
        propietario_id: { type: integer, example: 1 }
        tipo: { type: string, enum: [imagen, video, documento, gpx, audio], example: "imagen" }
        url: { type: string, example: "/static/uploads/imagen/3f2a9c1e5b7d4a8f9e0c1d2b3a4f5e6d.png" }
        nombre_original: { type: string, example: "portada.png" }
        tipo_mime: { type: string, example: "image/png" }
        tamano_bytes: { type: integer, example: 184320 }
        ancho_px: { type: integer, nullable: true, example: 1280 }
        alto_px: { type: integer, nullable: true, example: 720 }
        duracion_segundos: { type: integer, nullable: true, example: null }
        subido_en: { type: string, format: date-time, example: "2026-10-12T14:30:00" }
    Deporte:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: "Running" }
        categoria: { type: string, example: "resistencia" }
        activo: { type: boolean, example: true }
    Organizador:
      type: object
      properties:
        id: { type: integer, example: 1 }
        usuario_id: { type: integer, example: 1 }
        nombre_comercial: { type: string, example: "Carreras del Valle" }
        descripcion: { type: string, example: "Organizamos carreras de calle desde 2015" }
        correo_contacto: { type: string, example: "contacto@carrerasdelvalle.com" }
        telefono_contacto: { type: string, example: "5512345678" }
        logo_id: { type: integer, nullable: true, example: 1 }
        logo_url: { type: string, nullable: true, example: "/static/uploads/imagen/3f2a9c1e5b7d4a8f9e0c1d2b3a4f5e6d.png" }
        ciudad: { type: object, nullable: true }
        estado_validacion: { type: string, enum: [sin_solicitud, pendiente, en_revision, aprobada, rechazada, revocada], example: "sin_solicitud" }
        validado_en: { type: string, format: date-time, nullable: true }
        creado_en: { type: string, format: date-time, example: "2026-05-10T14:30:00" }
        miembros:
          type: array
          description: Solo viene en las respuestas de detalle (GET /me, GET /{id}, POST, PUT).
          items:
            type: object
            properties:
              organizador_id: { type: integer, example: 1 }
              usuario_id: { type: integer, example: 1 }
              nombre_usuario: { type: string, example: "anaperez" }
              rol: { type: string, enum: [propietario, administrador, colaborador], example: "propietario" }
              agregado_en: { type: string, format: date-time, example: "2026-05-10T14:30:00" }
    UsuarioDeporte:
      type: object
      description: Deporte que practica un usuario (tabla `usuario_deportes`).
      properties:
        deporte: { $ref: "#/components/schemas/Deporte" }
        nivel: { type: string, enum: [principiante, intermedio, avanzado, profesional], example: "intermedio" }
        es_principal: { type: boolean, example: true }
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      summary: Estado del servicio
      tags: [Sistema]
      security: []
      responses:
        "200": { description: El servicio está activo }

  /api/auth/register:
    post:
      summary: Autoregistro (siempre crea rol "usuario")
      tags: [Autenticación]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_completo, nombre_usuario, correo, password, fecha_nacimiento, sexo]
              properties:
                nombre_completo: { type: string, example: "Ana Pérez" }
                nombre_usuario: { type: string, maxLength: 30, example: "anaperez" }
                correo: { type: string, example: "ana@correo.com" }
                password: { type: string, example: "MiClave123!" }
                telefono: { type: string, pattern: '^[0-9]{7,15}$', minLength: 7, maxLength: 15, example: "5512345678", description: "Solo números (7 a 15 dígitos). Se guarda como texto para no perder ceros a la izquierda." }
                sexo: { type: string, enum: [masculino, femenino, otro, prefiero_no_decir], example: "femenino" }
                fecha_nacimiento: { type: string, format: date, example: "2000-05-10" }
                ciudad_id: { type: integer, minimum: 1, example: 1, description: "Debe ser el id de una ciudad existente." }
      responses:
        "201": { description: Usuario creado, regresa access_token + usuario }
        "400": { description: Campos faltantes o inválidos (sexo, fecha_nacimiento, telefono, ciudad_id) }
        "409": { description: Correo o nombre de usuario ya existen }

  /api/auth/login:
    post:
      summary: Iniciar sesión
      tags: [Autenticación]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, password]
              properties:
                correo: { type: string, example: "admin@sportmatch.com" }
                password: { type: string, example: "Admin123!" }
      responses:
        "200": { description: Login exitoso, regresa access_token + usuario }
        "401": { description: Credenciales inválidas }
        "403": { description: Cuenta suspendida o eliminada }

  /api/auth/olvide-contrasena:
    post:
      summary: Solicitar recuperación de contraseña (genera token de un solo uso)
      tags: [Autenticación]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo]
              properties:
                correo: { type: string, example: "ana@correo.com" }
      responses:
        "200":
          description: >
            Mensaje genérico (no revela si el correo existe). Si existe,
            incluye `token_reseteo` (temporal, solo para pruebas mientras
            no haya envío de correo real).
        "400": { description: correo faltante }

  /api/auth/restablecer-contrasena:
    post:
      summary: Cambiar la contraseña usando el token de /olvide-contrasena
      tags: [Autenticación]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, nueva_password]
              properties:
                token: { type: string }
                nueva_password: { type: string, example: "OtraClave456" }
      responses:
        "200": { description: Contraseña actualizada correctamente }
        "400": { description: Datos faltantes, token inválido, expirado o ya usado }
        "404": { description: Usuario no encontrado }

  /api/auth/me:
    get:
      summary: Datos del usuario autenticado
      tags: [Autenticación]
      responses:
        "200": { description: Usuario actual }

  /api/usuarios/me:
    put:
      summary: Actualizar mi propio perfil
      tags: [Usuarios]
      description: >
        No se puede cambiar `correo`, `nombre_usuario`, `fecha_nacimiento`
        ni `rol`/`estado_cuenta` por aquí (son datos sensibles o de
        identidad; el correo/usuario se cambiarían con su propio flujo de
        verificación, y el rol/estado solo los toca un admin). Todos los
        campos son opcionales: solo se actualiza lo que se envíe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre_completo: { type: string, example: "Ana Pérez" }
                telefono: { type: string, pattern: '^[0-9]{7,15}$', minLength: 7, maxLength: 15, example: "5512345678" }
                sexo: { type: string, enum: [masculino, femenino, otro, prefiero_no_decir], example: "femenino" }
                idioma: { type: string, example: "es" }
                zona_horaria: { type: string, example: "America/Mexico_City" }
                ciudad_id: { type: integer, minimum: 1, example: 1 }
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "400": { description: telefono, sexo o ciudad_id inválidos }

  /api/usuarios/me/password:
    put:
      summary: Cambiar mi contraseña
      tags: [Usuarios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_actual, password_nueva]
              properties:
                password_actual: { type: string }
                password_nueva: { type: string }
      responses:
        "200": { description: Contraseña actualizada }
        "401": { description: Contraseña actual incorrecta }

  /api/usuarios:
    get:
      summary: Listar usuarios (solo admin)
      tags: [Administradores]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
        - name: rol
          in: query
          schema: { type: string, enum: [usuario, organizador, administrador], example: "usuario" }
        - name: estado_cuenta
          in: query
          schema: { type: string, enum: [pendiente_verificacion, activa, suspendida, eliminada] }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200": { description: Lista paginada de usuarios }
        "403": { description: No tienes permisos }

  /api/usuarios/{usuario_id}:
    get:
      summary: Obtener un usuario por id (solo admin)
      tags: [Administradores]
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Usuario encontrado }
        "404": { description: No existe }

  /api/usuarios/{usuario_id}/rol:
    put:
      summary: Cambiar el rol de un usuario (solo admin)
      tags: [Administradores]
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties:
                rol: { type: string, enum: [usuario, organizador, administrador], example: "administrador" }
      responses:
        "200": { description: Rol actualizado }
        "400": { description: Rol inválido }

  /api/usuarios/{usuario_id}/estado:
    put:
      summary: Activar, suspender o eliminar (borrado suave) un usuario (solo admin)
      tags: [Administradores]
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado_cuenta]
              properties:
                estado_cuenta: { type: string, enum: [activa, suspendida, eliminada] }
      responses:
        "200": { description: Estado actualizado }
        "400": { description: Estado inválido }

  /api/usuarios/admins:
    post:
      summary: Crear otro administrador (solo admin)
      tags: [Administradores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_completo, nombre_usuario, correo, password, fecha_nacimiento, sexo]
              properties:
                nombre_completo: { type: string, example: "Ana Pérez" }
                nombre_usuario: { type: string, maxLength: 30, example: "anaperez" }
                correo: { type: string, example: "ana@correo.com" }
                password: { type: string, example: "ClaveSegura123" }
                fecha_nacimiento: { type: string, format: date, example: "2000-05-10" }
                sexo: { type: string, enum: [masculino, femenino, otro, prefiero_no_decir], example: "femenino" }
      responses:
        "201": { description: Administrador creado }
        "400": { description: Campos faltantes o inválidos (sexo, fecha_nacimiento, nombre_usuario) }
        "409": { description: Correo o nombre de usuario ya existen }

  /api/deportes:
    get:
      summary: Listar catálogo de deportes (público; ?incluir_inactivos=1 para admin)
      tags: [Deportes]
      security: []
      responses:
        "200":
          description: Lista de deportes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Deporte" } }
    post:
      summary: Crear un deporte (solo admin)
      tags: [Deportes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, example: "Running" }
                categoria: { type: string, example: "resistencia" }
                activo: { type: boolean, example: true }
      responses:
        "201":
          description: Deporte creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deporte" }
        "409": { description: Ya existe un deporte con ese nombre }

  /api/deportes/{deporte_id}:
    get:
      summary: Obtener un deporte
      tags: [Deportes]
      security: []
      parameters:
        - { name: deporte_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "200":
          description: Deporte encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deporte" }
    put:
      summary: Actualizar un deporte (solo admin)
      tags: [Deportes]
      parameters:
        - { name: deporte_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, example: "Running" }
                categoria: { type: string, example: "resistencia" }
                activo: { type: boolean, example: true }
      responses:
        "200":
          description: Deporte actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deporte" }
    delete:
      summary: Desactivar un deporte (borrado suave, solo admin)
      tags: [Deportes]
      parameters:
        - { name: deporte_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "200":
          description: Deporte desactivado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deporte" }

  /api/deportes/me:
    get:
      summary: Listar mis deportes
      tags: [Deportes]
      responses:
        "200":
          description: Deportes del usuario autenticado
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UsuarioDeporte" } }
    post:
      summary: Agregar un deporte a mi perfil
      tags: [Deportes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deporte_id]
              properties:
                deporte_id: { type: integer, example: 1 }
                nivel: { type: string, enum: [principiante, intermedio, avanzado, profesional], example: "intermedio" }
                es_principal: { type: boolean, example: true }
      responses:
        "201":
          description: Deporte agregado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDeporte" }
        "409": { description: Ya tienes ese deporte registrado }

  /api/deportes/me/{deporte_id}:
    put:
      summary: Actualizar nivel / es_principal de uno de mis deportes
      tags: [Deportes]
      parameters:
        - { name: deporte_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nivel: { type: string, enum: [principiante, intermedio, avanzado, profesional], example: "avanzado" }
                es_principal: { type: boolean, example: true }
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDeporte" }
    delete:
      summary: Quitar un deporte de mi perfil
      tags: [Deportes]
      parameters:
        - { name: deporte_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "204": { description: Eliminado }

  /api/cuestionarios:
    get:
      summary: Listar cuestionarios (público; ?incluir_inactivos=1 para admin)
      tags: [Cuestionario de registro]
      security: []
      responses:
        "200": { description: Lista de cuestionarios }
    post:
      summary: Crear un cuestionario (solo admin)
      tags: [Cuestionario de registro]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, titulo]
              properties:
                codigo: { type: string, example: "registro_v1" }
                titulo: { type: string }
                descripcion: { type: string }
      responses:
        "201": { description: Cuestionario creado }

  /api/cuestionarios/{codigo}:
    get:
      summary: Obtener un cuestionario completo (preguntas + opciones) por su código
      tags: [Cuestionario de registro]
      security: []
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Cuestionario con preguntas y opciones anidadas }

  /api/cuestionarios/{cuestionario_id}/preguntas:
    post:
      summary: Agregar una pregunta a un cuestionario, opcionalmente con sus opciones (solo admin)
      tags: [Cuestionario de registro]
      parameters:
        - { name: cuestionario_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, texto]
              properties:
                codigo: { type: string }
                texto: { type: string }
                tipo: { type: string, enum: [opcion_unica, opcion_multiple, texto_libre, escala] }
                obligatoria: { type: boolean }
                opciones:
                  type: array
                  items:
                    type: object
                    properties:
                      texto: { type: string }
                      deporte_id: { type: integer }
      responses:
        "201": { description: Pregunta creada }

  /api/cuestionarios/{codigo}/responder:
    post:
      summary: Responder un cuestionario (usuario autenticado)
      tags: [Cuestionario de registro]
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuestas]
              properties:
                respuestas:
                  type: array
                  items:
                    type: object
                    properties:
                      pregunta_id: { type: integer }
                      opcion_id: { type: integer, nullable: true }
                      respuesta_texto: { type: string, nullable: true }
      responses:
        "201": { description: Respuestas guardadas }

  /api/cuestionarios/me/respuestas:
    get:
      summary: Ver mis respuestas
      tags: [Cuestionario de registro]
      responses:
        "200": { description: Respuestas del usuario autenticado }

  /api/eventos:
    get:
      summary: Listar eventos (público; por defecto solo estado=publicado). Filtros - Query params - estado, tipo, deporte_id, ciudad_id, q, page, per_page
      tags: [Eventos]
      security: []
      responses:
        "200": { description: Lista paginada de eventos }
    post:
      summary: Crear un evento, opcionalmente con deportes/requisitos/sedes/fechas/categorías+boletos anidados (admin, o miembro de un organizador aprobado)
      tags: [Eventos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, tipo, organizador_id]
              properties:
                organizador_id: { type: integer, minimum: 1, example: 1, description: "Obligatorio: todo evento pertenece a un organizador existente. Si quien crea no es admin, debe ser miembro de ese organizador y este debe estar aprobado." }
                titulo: { type: string, example: "5K Nocturna" }
                tipo: { type: string, enum: [carrera, ruta, torneo, liga, entrenamiento, experiencia_grupal], example: "carrera" }
                slug: { type: string, example: "5k-nocturna", description: "Opcional; si se omite se genera a partir del título." }
                dificultad: { type: string, enum: [facil, moderada, dificil, extrema], example: "moderada" }
                descripcion: { type: string, example: "Carrera nocturna por el centro de la ciudad" }
                portada_id: { type: integer, minimum: 1, example: 1, description: "Opcional. Id de una imagen subida con POST /api/archivos." }
                edad_minima: { type: integer, minimum: 0, example: 12 }
                es_publico: { type: boolean, example: true }
                deportes: { type: array, items: { type: integer, example: 1 } }
                requisitos:
                  type: array
                  items: { type: object, properties: { descripcion: { type: string, example: "Certificado médico" }, orden: { type: integer, example: 1 } } }
                sedes:
                  type: array
                  items:
                    type: object
                    required: [nombre]
                    properties:
                      tipo: { type: string, enum: [salida, meta, punto_encuentro, entrega_kit], example: "salida", description: "Si se omite, se usa punto_encuentro." }
                      nombre: { type: string, example: "Parque Central" }
                      direccion: { type: string, example: "Av. Principal 123" }
                      ciudad_id: { type: integer, minimum: 1, example: 1 }
                      latitud: { type: number, example: 19.2826 }
                      longitud: { type: number, example: -99.6557 }
                fechas:
                  type: array
                  items: { type: object, required: [inicia_en], properties: { inicia_en: { type: string, format: date-time, example: "2026-11-15T19:00:00" }, termina_en: { type: string, format: date-time, example: "2026-11-15T22:00:00" } } }
                categorias:
                  type: array
                  items:
                    type: object
                    required: [nombre]
                    properties:
                      nombre: { type: string, example: "5K Varonil" }
                      distancia_km: { type: number, exclusiveMinimum: 0, example: 5 }
                      edad_minima: { type: integer, minimum: 0, example: 18 }
                      edad_maxima: { type: integer, example: 45, description: "No puede ser menor que edad_minima." }
                      cupo_total: { type: integer, minimum: 1, example: 100 }
                      permite_lista_espera: { type: boolean, example: false }
                      boletos:
                        type: array
                        items:
                          type: object
                          properties:
                            tipo: { type: string, enum: [general, preventa, estudiante, grupal], example: "general" }
                            precio: { type: number, minimum: 0, example: 250 }
                            moneda: { type: string, example: "MXN" }
                            disponible_desde: { type: string, format: date-time, example: "2026-09-01T00:00:00" }
                            disponible_hasta: { type: string, format: date-time, example: "2026-11-10T23:59:59", description: "Debe ser posterior a disponible_desde." }
                            cantidad_maxima: { type: integer, example: 100 }
      responses:
        "201": { description: Evento creado (borrador) con todo lo anidado }
        "400": { description: Faltan campos u obtienen valores inválidos (tipo, dificultad, organizador_id, sedes/categorías/boletos) }
        "403": { description: No perteneces a ese organizador, o el organizador todavía no está aprobado }

  /api/eventos/{evento_id}:
    get:
      summary: Detalle de un evento (con deportes/requisitos/sedes/fechas/categorías/boletos)
      tags: [Eventos]
      security: []
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "200": { description: Evento }
    put:
      summary: Actualizar un evento, incl. cambiar `estado` (borrador/en_revision/publicado/cancelado/finalizado) (admin o miembro del organizador dueño)
      tags: [Eventos]
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo: { type: string, example: "5K Nocturna 2026" }
                tipo: { type: string, enum: [carrera, ruta, torneo, liga, entrenamiento, experiencia_grupal], example: "carrera" }
                dificultad: { type: string, enum: [facil, moderada, dificil, extrema], example: "moderada" }
                descripcion: { type: string, example: "Carrera nocturna por el centro de la ciudad" }
                portada_id: { type: integer, minimum: 1, example: 1, description: "Id de una imagen subida con POST /api/archivos." }
                edad_minima: { type: integer, minimum: 0, example: 12 }
                es_publico: { type: boolean, example: true }
                estado: { type: string, enum: [borrador, en_revision, publicado, cancelado, finalizado], example: "publicado" }
      responses:
        "200": { description: Evento actualizado }
    delete:
      summary: Eliminar un evento (borrado suave, queda cancelado; admin o miembro del organizador dueño)
      tags: [Eventos]
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "200": { description: Evento marcado como cancelado/eliminado }

  /api/eventos/slug/{slug}:
    get:
      summary: Detalle de un evento por su slug
      tags: [Eventos]
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, example: "5k-nocturna" } }
      responses:
        "200": { description: Evento }

  /api/eventos/{evento_id}/deportes:
    post:
      summary: Asociar un deporte a un evento (admin o miembro del organizador dueño)
