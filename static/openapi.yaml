    put:
      summary: Cancelar una inscripción (dueño o admin). Si había lista de espera, sube al siguiente.
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: inscripcion_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Inscripción cancelada }

  /api/inscripciones/{inscripcion_id}/estado:
    put:
      summary: Cambiar el estado de una inscripción a mano (solo admin, mientras no exista el módulo de pagos)
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: inscripcion_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [pendiente_pago, inscrito, activo, lista_espera, completado, cancelado, no_asistio] }
      responses:
        "200": { description: Estado actualizado }

  /api/inscripciones/{inscripcion_id}/resultado:
    put:
      summary: Registrar asistencia y resultado el día del evento (solo admin)
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: inscripcion_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asistio: { type: boolean }
                asistencia_latitud: { type: number }
                asistencia_longitud: { type: number }
                tiempo_oficial: { type: string, example: "00:28:15" }
                posicion_general: { type: integer }
                posicion_categoria: { type: integer }
                numero_participante: { type: string }
                completada: { type: boolean }
      responses:
        "200": { description: Inscripción actualizada }

  /api/eventos/{evento_id}/inscripciones:
    get:
      summary: Ver quién se inscribió a un evento (solo admin). Filtros - categoria_id, estado
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Lista de inscripciones del evento }

  /api/inscripciones/{inscripcion_id}/valoracion:
    post:
      summary: Valorar el evento tras asistir (solo si la inscripción está "completada"; usuario dueño)
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: inscripcion_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calificacion_evento]
              properties:
                calificacion_evento: { type: integer, minimum: 1, maximum: 5 }
                calificacion_organizador: { type: integer, minimum: 1, maximum: 5 }
                comentario: { type: string }
      responses:
        "201": { description: Valoración guardada (crea o actualiza) }
        "400": { description: La inscripción todavía no está "completada" }

  /api/eventos/{evento_id}/valoraciones:
    get:
      summary: Ver las valoraciones públicas de un evento
      tags: [Inscripciones y valoraciones]
      security: []
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Lista de valoraciones }

  /api/valoraciones/{valoracion_id}/responder:
    put:
      summary: Responder públicamente a una valoración (organizador; por ahora, admin)
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: valoracion_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuesta_organizador]
              properties:
                respuesta_organizador: { type: string }
      responses:
        "200": { description: Respuesta guardada }

  /api/usuarios/me/calendario:
    get:
      summary: Ver las fechas de eventos que guardé en mi calendario
      tags: [Inscripciones y valoraciones]
      responses:
        "200": { description: Lista de fechas guardadas }
    post:
      summary: Agregar una fecha de evento a mi calendario
      tags: [Inscripciones y valoraciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha_id]
              properties:
                fecha_id: { type: integer }
      responses:
        "201": { description: Agregado al calendario }

  /api/usuarios/me/calendario/{fecha_id}:
    delete:
      summary: Quitar una fecha de mi calendario
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: fecha_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Eliminado }

  /api/organizadores:
    get:
      summary: Listar organizadores (público; solo aprobados. ?estado_validacion= para admin)
      tags: [Organizadores]
      security: []
      responses:
        "200":
          description: Lista de organizadores
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Organizador" } }
    post:
      summary: Crear mi perfil de organizador (autenticado; uno por usuario, queda "sin_solicitud" hasta enviarlo a revisión)
      tags: [Organizadores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_comercial]
              properties:
                nombre_comercial: { type: string, example: "Carreras del Valle" }
                descripcion: { type: string, example: "Organizamos carreras de calle desde 2015" }
                correo_contacto: { type: string, example: "contacto@carrerasdelvalle.com" }
                telefono_contacto: { type: string, pattern: '^[0-9]{7,15}$', minLength: 7, maxLength: 15, example: "5512345678", description: "Solo números (7 a 15 dígitos)." }
                logo_id: { type: integer, minimum: 1, example: 1, description: "Opcional. Id de una imagen subida con POST /api/archivos." }
                ciudad_id: { type: integer, minimum: 1, example: 1 }
      responses:
        "201":
          description: Organizador creado — guarda el `id` de la respuesta, es el `organizador_id` que luego pide POST /api/eventos (o consúltalo después con GET /api/organizadores/me)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organizador" }
        "409": { description: Ya tienes un perfil de organizador }

  /api/organizadores/me:
    get:
      summary: Mi propio perfil de organizador (aquí se obtiene el organizador_id para crear eventos)
      tags: [Organizadores]
      description: >
        El listado público `GET /api/organizadores` solo muestra los
        aprobados, así que mientras el tuyo esté en `sin_solicitud` o
        `en_revision` no aparece ahí. Este endpoint es la forma de
        encontrar tu propio `id` de organizador (el que pide
        `organizador_id` en `POST /api/eventos`) sin tener que guardarlo
        a mano desde la respuesta de cuando lo creaste.
      responses:
        "200":
          description: Mi organizador
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organizador" }
        "404": { description: Todavía no tienes un perfil de organizador (créalo con POST /api/organizadores) }

  /api/organizadores/{organizador_id}:
    get:
      summary: Detalle de un organizador
      tags: [Organizadores]
      security: []
      parameters:
        - { name: organizador_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "200":
          description: Organizador
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organizador" }
    put:
      summary: Editar mi organizador (miembro propietario/administrador, o admin)
      tags: [Organizadores]
      parameters:
        - { name: organizador_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre_comercial: { type: string, example: "Carreras del Valle" }
                descripcion: { type: string, example: "Organizamos carreras de calle desde 2015" }
                correo_contacto: { type: string, example: "contacto@carrerasdelvalle.com" }
                telefono_contacto: { type: string, pattern: '^[0-9]{7,15}$', minLength: 7, maxLength: 15, example: "5512345678" }
                logo_id: { type: integer, minimum: 1, example: 1, description: "Id de una imagen subida con POST /api/archivos." }
                ciudad_id: { type: integer, minimum: 1, example: 1 }
      responses:
        "200":
          description: Organizador actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organizador" }
        "400": { description: telefono_contacto inválido }

  /api/organizadores/{organizador_id}/miembros:
    post:
      summary: Agregar un miembro al equipo del organizador
      tags: [Organizadores]
      parameters:
        - { name: organizador_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario_id]
              properties:
                usuario_id: { type: integer }
                rol: { type: string, enum: [propietario, administrador, colaborador], example: "colaborador" }
      responses:
        "201": { description: Miembro agregado }

  /api/organizadores/{organizador_id}/solicitudes:
    post:
      summary: Enviar el organizador a revisión, opcionalmente con documentos anexos
      tags: [Organizadores]
      parameters:
        - { name: organizador_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentos:
                  type: array
                  items:
                    type: object
                    properties:
                      tipo_documento: { type: string, enum: [ine, curp, comprobante_domicilio, rfc, permiso_evento], example: "ine" }
                      archivo_id: { type: integer, minimum: 1, example: 1, description: "Id de una imagen o PDF subido con POST /api/archivos." }
                      numero_documento: { type: string, example: "ABCD123456HDFRRL09" }
      responses:
        "201": { description: Solicitud enviada (organizador pasa a "en_revision") }
        "409": { description: Ya hay una solicitud pendiente }

  /api/organizadores/solicitudes/{solicitud_id}/documentos:
    post:
      summary: Agregar un documento a una solicitud de validación (dueño del organizador o admin)
      tags: [Organizadores]
      parameters:
        - { name: solicitud_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo_documento, archivo_id]
              properties:
                tipo_documento: { type: string, enum: [ine, curp, comprobante_domicilio, rfc, permiso_evento], example: "ine" }
                archivo_id: { type: integer, minimum: 1, example: 1, description: "Id de una imagen o PDF subido con POST /api/archivos." }
                numero_documento: { type: string, example: "ABCD123456HDFRRL09" }
      responses:
        "201": { description: Documento agregado }
        "400": { description: tipo_documento inválido, o archivo_id inexistente / de un tipo que no sirve (solo imagen o PDF) }

  /api/organizadores/solicitudes:
    get:
      summary: Bandeja de solicitudes de validación (solo admin; ?estado=pendiente por defecto)
      tags: [Organizadores]
      responses:
        "200": { description: Lista de solicitudes }

  /api/organizadores/solicitudes/{solicitud_id}/revisar:
    put:
      summary: Aprobar o rechazar una solicitud de validación (solo admin)
      tags: [Organizadores]
      parameters:
        - { name: solicitud_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [aprobar, rechazar] }
                comentarios: { type: string }
                motivo_rechazo: { type: string }
      responses:
        "200": { description: Organizador y solicitud actualizados }

  /api/reportes:
    post:
      summary: Reportar contenido o a un usuario (tipo_entidad/entidad_id son genéricos)
      tags: [Administración y soporte]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo_entidad, entidad_id, motivo]
              properties:
                tipo_entidad: { type: string, maxLength: 30, example: "evento" }
                entidad_id: { type: integer, example: 42 }
                motivo: { type: string, maxLength: 30, example: "spam" }
                descripcion: { type: string, example: "Publicó el mismo comentario varias veces" }
      responses:
        "201": { description: Reporte creado }
        "400": { description: Faltan campos o tipo_entidad/motivo exceden 30 caracteres }
    get:
      summary: Bandeja de moderación (solo admin; ?estado=pendiente por defecto)
      tags: [Administración y soporte]
      responses:
        "200": { description: Lista de reportes }

  /api/reportes/{reporte_id}:
    put:
      summary: Moderar un reporte (solo admin) — se registra en la bitácora de auditoría
      tags: [Administración y soporte]
      parameters:
        - { name: reporte_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { type: string, enum: [pendiente, en_revision, resuelto, desestimado], example: "resuelto" }
                accion_tomada: { type: string, maxLength: 30, example: "advertencia" }
                notas_moderador: { type: string, example: "Se contactó al usuario reportado" }
      responses:
        "200": { description: Reporte actualizado }
        "400": { description: accion_tomada excede 30 caracteres }

  /api/tickets:
    post:
      summary: Abrir un ticket de soporte con el mensaje inicial
      tags: [Administración y soporte]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asunto, mensaje, categoria]
              properties:
                asunto: { type: string, example: "No puedo pagar mi inscripción" }
                mensaje: { type: string, example: "Me sale un error al intentar pagar con tarjeta" }
                categoria: { type: string, maxLength: 20, example: "pagos" }
                prioridad: { type: string, enum: [baja, media, alta, urgente], example: "media" }
      responses:
        "201": { description: Ticket creado }
        "400": { description: Faltan campos, categoria vacía o excede 20 caracteres }
    get:
      summary: Bandeja de soporte (solo admin; filtros estado, prioridad, asignado_a)
      tags: [Administración y soporte]
      responses:
        "200": { description: Lista de tickets }

  /api/tickets/{ticket_id}:
    get:
      summary: Detalle de un ticket con sus mensajes (dueño no ve mensajes internos)
      tags: [Administración y soporte]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "200": { description: Ticket con mensajes }
    put:
      summary: Asignar, priorizar o cerrar un ticket (solo admin)
      tags: [Administración y soporte]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                asignado_a: { type: integer, example: 2 }
                categoria: { type: string, maxLength: 20, example: "cuenta" }
                prioridad: { type: string, enum: [baja, media, alta, urgente], example: "alta" }
                estado: { type: string, enum: [abierto, en_progreso, resuelto, cerrado], example: "cerrado" }
      responses:
        "200": { description: Ticket actualizado }
        "400": { description: categoria vacía o excede 20 caracteres }

  /api/tickets/{ticket_id}/mensajes:
    post:
      summary: Agregar un mensaje al ticket (dueño o admin; solo admin puede marcarlo es_interno)
      tags: [Administración y soporte]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mensaje]
              properties:
                mensaje: { type: string, example: "Ya revisamos tu caso, en breve te contactamos" }
                es_interno: { type: boolean, example: false }
      responses:
        "201": { description: Mensaje agregado }

  /api/admin/auditoria:
    get:
      summary: Bitácora de auditoría de solo lectura (solo admin)
      tags: [Administración y soporte]
      parameters:
        - { name: tipo_entidad, in: query, schema: { type: string } }
        - { name: entidad_id, in: query, schema: { type: integer } }
        - { name: usuario_id, in: query, schema: { type: integer } }
      responses:
        "200": { description: Lista paginada de registros de auditoría }
