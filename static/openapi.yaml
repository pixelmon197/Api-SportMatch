                tipo: { type: string, enum: [salida, meta, punto_encuentro, entrega_kit], example: "salida", description: "Si se omite, se usa punto_encuentro." }
                nombre: { type: string, example: "Parque Central" }
                direccion: { type: string, example: "Av. Principal 123" }
                ciudad_id: { type: integer, minimum: 1, example: 1 }
                latitud: { type: number, example: 19.2826 }
                longitud: { type: number, example: -99.6557 }
      responses:
        "201": { description: Sede creada }
        "400": { description: nombre faltante o tipo inválido }

  /api/eventos/sedes/{sede_id}:
    put:
      summary: Editar una sede
      tags: [Eventos]
      parameters:
        - { name: sede_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tipo: { type: string, enum: [salida, meta, punto_encuentro, entrega_kit], example: "meta" }
                nombre: { type: string, example: "Arco de meta" }
                direccion: { type: string, example: "Av. Principal 456" }
                ciudad_id: { type: integer, minimum: 1, example: 1 }
                latitud: { type: number, example: 19.2826 }
                longitud: { type: number, example: -99.6557 }
      responses:
        "200": { description: Sede actualizada }
        "400": { description: tipo inválido }
    delete:
      summary: Eliminar una sede
      tags: [Eventos]
      parameters:
        - { name: sede_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "204": { description: Sede eliminada }

  /api/eventos/{evento_id}/fechas:
    post:
      summary: Agregar una fecha a un evento (admin o miembro del organizador dueño)
      tags: [Eventos]
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inicia_en]
              properties:
                inicia_en: { type: string, format: date-time, example: "2026-11-15T19:00:00" }
                termina_en: { type: string, format: date-time, example: "2026-11-15T22:00:00", description: "Debe ser posterior a inicia_en." }
      responses:
        "201": { description: Fecha creada }
        "400": { description: inicia_en es obligatorio }

  /api/eventos/fechas/{fecha_id}:
    put:
      summary: Editar una fecha (incl. marcarla como cancelada con cancelada_en)
      tags: [Eventos]
      parameters:
        - { name: fecha_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                inicia_en: { type: string, format: date-time, example: "2026-11-16T19:00:00" }
                termina_en: { type: string, format: date-time, example: "2026-11-16T22:00:00" }
                cancelada_en: { type: string, format: date-time, nullable: true, example: null }
      responses:
        "200": { description: Fecha actualizada }
    delete:
      summary: Eliminar una fecha
      tags: [Eventos]
      parameters:
        - { name: fecha_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "204": { description: Fecha eliminada }

  /api/eventos/{evento_id}/categorias:
    post:
      summary: Agregar una categoría a un evento existente (admin o miembro del organizador dueño)
      tags: [Eventos]
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, example: "5K Varonil" }
                distancia_km: { type: number, exclusiveMinimum: 0, example: 5 }
                edad_minima: { type: integer, minimum: 0, example: 18 }
                edad_maxima: { type: integer, example: 45, description: "No puede ser menor que edad_minima." }
                cupo_total: { type: integer, minimum: 1, example: 100 }
                permite_lista_espera: { type: boolean, example: false }
      responses:
        "201": { description: Categoría creada }
        "400": { description: nombre faltante, o edades/distancia/cupo inválidos }

  /api/eventos/categorias/{categoria_id}:
    put:
      summary: Editar una categoría
      tags: [Eventos]
      parameters:
        - { name: categoria_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, example: "5K Femenil" }
                distancia_km: { type: number, exclusiveMinimum: 0, example: 5 }
                edad_minima: { type: integer, minimum: 0, example: 18 }
                edad_maxima: { type: integer, example: 45 }
                cupo_total: { type: integer, minimum: 1, example: 150 }
                permite_lista_espera: { type: boolean, example: true }
      responses:
        "200": { description: Categoría actualizada }
        "400": { description: edades/distancia/cupo inválidos }
    delete:
      summary: Eliminar una categoría
      tags: [Eventos]
      parameters:
        - { name: categoria_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "204": { description: Categoría eliminada }

  /api/eventos/categorias/{categoria_id}/boletos:
    post:
      summary: Agregar un tipo de boleto a una categoría (admin o miembro del organizador dueño)
      tags: [Eventos]
      parameters:
        - { name: categoria_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tipo: { type: string, enum: [general, preventa, estudiante, grupal], example: "general", description: "Si se omite, se usa general." }
                precio: { type: number, minimum: 0, example: 250 }
                moneda: { type: string, example: "MXN" }
                disponible_desde: { type: string, format: date-time, example: "2026-09-01T00:00:00" }
                disponible_hasta: { type: string, format: date-time, example: "2026-11-10T23:59:59", description: "Debe ser posterior a disponible_desde." }
                cantidad_maxima: { type: integer, example: 100 }
      responses:
        "201": { description: Boleto creado }
        "400": { description: tipo, precio o fechas de disponibilidad inválidos }

  /api/eventos/boletos/{boleto_id}:
    put:
      summary: Editar un boleto
      tags: [Eventos]
      parameters:
        - { name: boleto_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tipo: { type: string, enum: [general, preventa, estudiante, grupal], example: "preventa" }
                precio: { type: number, minimum: 0, example: 200 }
                moneda: { type: string, example: "MXN" }
                disponible_desde: { type: string, format: date-time, example: "2026-09-01T00:00:00" }
                disponible_hasta: { type: string, format: date-time, example: "2026-10-15T23:59:59" }
                cantidad_maxima: { type: integer, example: 50 }
                activo: { type: boolean, example: true }
      responses:
        "200": { description: Boleto actualizado }
        "400": { description: tipo, precio o fechas de disponibilidad inválidos }
    delete:
      summary: Eliminar un boleto
      tags: [Eventos]
      parameters:
        - { name: boleto_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "204": { description: Boleto eliminado }

  /api/rutas:
    get:
      summary: Listar rutas públicas. Filtros - deporte_id, creador_id
      tags: [Rutas]
      security: []
      responses:
        "200": { description: Lista de rutas }
    post:
      summary: Crear una ruta propia, opcionalmente con sus puntos GPS (cualquier usuario autenticado)
      tags: [Rutas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, deporte_id]
              properties:
                nombre: { type: string, example: "Sendero del Bosque" }
                deporte_id: { type: integer, minimum: 1, example: 1 }
                dificultad: { type: string, enum: [facil, moderada, dificil, extrema], example: "moderada" }
                distancia_m: { type: integer, exclusiveMinimum: 0, example: 5000, description: "Metros, número entero mayor a 0." }
                desnivel_positivo_m: { type: integer, minimum: 0, example: 120 }
                puntos:
                  type: array
                  items:
                    type: object
                    required: [latitud, longitud]
                    properties:
                      tipo: { type: string, enum: [inicio, meta, hidratacion, punto_interes, mirador, peligro], example: "inicio", description: "Si se omite, se usa punto_interes." }
                      orden: { type: integer, example: 1, description: "No se puede repetir dentro de la misma ruta." }
                      latitud: { type: number, example: 19.4 }
                      longitud: { type: number, example: -99.1 }
      responses:
        "201": { description: Ruta creada }

  /api/rutas/{ruta_id}:
    get:
      summary: Detalle de una ruta con sus puntos
      tags: [Rutas]
      security: []
      parameters:
        - { name: ruta_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Ruta }
    put:
      summary: Editar mi ruta (dueño o admin)
      tags: [Rutas]
      parameters:
        - { name: ruta_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Ruta actualizada }
        "403": { description: No tienes permisos sobre esta ruta }
    delete:
      summary: Eliminar mi ruta (borrado suave; dueño o admin)
      tags: [Rutas]
      parameters:
        - { name: ruta_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Ruta eliminada }

  /api/rutas/categorias/{categoria_id}/rutas:
    get:
      summary: Ver las rutas ligadas a una categoría de evento
