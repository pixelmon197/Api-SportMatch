                  total: { type: integer, example: 3 }
                  page: { type: integer, example: 1 }
                  per_page: { type: integer, example: 20 }
                  paginas: { type: integer, example: 1 }

  /api/amistades/solicitudes:
    post:
      summary: Enviar una solicitud de amistad
      tags: [Amistades]
      description: Si antes te la habían rechazado, se reutiliza esa solicitud y vuelve a quedar pendiente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario_id]
              properties:
                usuario_id: { type: integer, minimum: 1, example: 3, description: "Id del usuario al que le envías la solicitud." }
      responses:
        "201":
          description: Solicitud enviada (estado pendiente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Amistad" }
        "400": { description: usuario_id faltante o inválido, o te lo mandas a ti mismo }
        "404": { description: El usuario no existe, está suspendido, o te bloqueó }
        "409": { description: Ya son amigos, ya enviaste una solicitud, esa persona ya te envió una (viene su `solicitud_id` para aceptarla), o lo tienes bloqueado }

  /api/amistades/solicitudes/recibidas:
    get:
      summary: Solicitudes de amistad pendientes que me enviaron
      tags: [Amistades]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1, example: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20, example: 20 } }
      responses:
        "200":
          description: Lista paginada. Usa `solicitud_id` para aceptar o rechazar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  solicitudes:
                    type: array
                    items:
                      type: object
                      properties:
                        solicitud_id: { type: integer, example: 1 }
                        usuario: { $ref: "#/components/schemas/TarjetaUsuario" }
                        creado_en: { type: string, format: date-time, example: "2026-10-19T14:30:00" }
                  total: { type: integer, example: 1 }
                  page: { type: integer, example: 1 }
                  per_page: { type: integer, example: 20 }
                  paginas: { type: integer, example: 1 }

  /api/amistades/solicitudes/enviadas:
    get:
      summary: Solicitudes de amistad pendientes que yo envié
      tags: [Amistades]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1, example: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20, example: 20 } }
      responses:
        "200":
          description: Lista paginada. Usa `solicitud_id` para cancelar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  solicitudes:
                    type: array
                    items:
                      type: object
                      properties:
                        solicitud_id: { type: integer, example: 1 }
                        usuario: { $ref: "#/components/schemas/TarjetaUsuario" }
                        creado_en: { type: string, format: date-time, example: "2026-10-19T14:30:00" }
                  total: { type: integer, example: 1 }
                  page: { type: integer, example: 1 }
                  per_page: { type: integer, example: 20 }
                  paginas: { type: integer, example: 1 }

  /api/amistades/solicitudes/{solicitud_id}/aceptar:
    put:
      summary: Aceptar una solicitud que me enviaron
      tags: [Amistades]
      parameters:
        - { name: solicitud_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "200":
          description: Ahora son amigos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Amistad" }
        "403": { description: La solicitud no es para ti }
        "404": { description: No existe }
        "409": { description: Ya estaba aceptada o rechazada }

  /api/amistades/solicitudes/{solicitud_id}/rechazar:
    put:
      summary: Rechazar una solicitud que me enviaron
      tags: [Amistades]
      parameters:
        - { name: solicitud_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "200":
          description: Solicitud rechazada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Amistad" }
        "403": { description: La solicitud no es para ti }
        "404": { description: No existe }
        "409": { description: Ya estaba aceptada o rechazada }

  /api/amistades/solicitudes/{solicitud_id}:
    delete:
      summary: Cancelar una solicitud que yo envié (solo si sigue pendiente)
      tags: [Amistades]
      parameters:
        - { name: solicitud_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "204": { description: Solicitud cancelada }
        "403": { description: No la enviaste tú }
        "404": { description: No existe }
        "409": { description: Ya no estaba pendiente }

  /api/amistades/amigos/{usuario_id}:
    delete:
      summary: Eliminar a alguien de mis amigos (se borra para ambos)
      tags: [Amistades]
      parameters:
        - { name: usuario_id, in: path, required: true, schema: { type: integer, example: 2 } }
      responses:
        "204": { description: Amistad eliminada }
        "404": { description: No son amigos }

  /api/bloqueos:
    get:
      summary: Usuarios que he bloqueado
      tags: [Bloqueos]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1, example: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20, example: 20 } }
      responses:
        "200":
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  bloqueados:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/TarjetaUsuario" }
                        - type: object
                          properties:
                            bloqueado_en: { type: string, format: date-time, example: "2026-10-19T14:30:00" }
                  total: { type: integer, example: 3 }
                  page: { type: integer, example: 1 }
                  per_page: { type: integer, example: 20 }
                  paginas: { type: integer, example: 1 }

  /api/bloqueos/{usuario_id}:
    post:
      summary: Bloquear a un usuario
      tags: [Bloqueos]
      description: >
        La persona bloqueada ya no puede ver tu perfil (le sale 404), seguirte
        ni enviarte solicitudes. Además se borran los seguimientos (en ambos
        sentidos) y la amistad o solicitudes pendientes que hubiera entre los dos.
        Desbloquear después NO los restaura.
      parameters:
        - { name: usuario_id, in: path, required: true, schema: { type: integer, example: 2 } }
      responses:
        "201": { description: Usuario bloqueado }
        "400": { description: No puedes bloquearte a ti mismo }
        "404": { description: El usuario no existe }
        "409": { description: Ya lo tenías bloqueado }
    delete:
      summary: Desbloquear a un usuario
      tags: [Bloqueos]
      parameters:
        - { name: usuario_id, in: path, required: true, schema: { type: integer, example: 2 } }
      responses:
        "204": { description: Usuario desbloqueado }
        "404": { description: No lo tenías bloqueado }

  /api/archivos:
    post:
      summary: Subir una imagen, video, documento (PDF), GPX o audio. Regresa el `id` que luego se usa en portada_id, logo_id, gpx_archivo_id o archivo_id
      tags: [Archivos]
      description: >
        Se manda como `multipart/form-data` (en Swagger aparece un botón
        para elegir el archivo). El `tipo` es opcional, si no se manda se
        adivina por la extensión. Extensiones y tamaño máximo por tipo -
        imagen (jpg, jpeg, png, webp, gif; 8 MB), video (mp4, mov, webm;
        200 MB), documento (pdf; 15 MB), gpx (gpx; 5 MB), audio (mp3, wav,
        m4a; 30 MB). Flujo típico - 1) subir el archivo, 2) copiar el `id`
        de la respuesta, 3) mandarlo en el endpoint que lo usa (por
        ejemplo `portada_id` en POST /api/eventos).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary, description: "El archivo a subir." }
                tipo: { type: string, enum: [imagen, video, documento, gpx, audio], example: "imagen", description: "Opcional. Si se omite se deduce de la extensión." }
                duracion_segundos: { type: integer, example: 95, description: "Opcional, solo para video/audio (el servidor no la calcula)." }
      responses:
        "201":
          description: Archivo subido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Archivo" }
        "400": { description: Falta el archivo, está vacío, tipo/extensión no permitidos o supera el tamaño máximo del tipo }
        "413": { description: El request supera el tope global de 210 MB }

  /api/archivos/{archivo_id}:
    get:
      summary: Ver los datos de un archivo subido (incluye su url)
      tags: [Archivos]
      security: []
      parameters:
        - { name: archivo_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "200":
          description: Archivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Archivo" }
        "404": { description: No existe o fue eliminado }
    delete:
      summary: Eliminar un archivo (borrado suave; solo su dueño o un admin)
      tags: [Archivos]
      parameters:
        - { name: archivo_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "204": { description: Archivo eliminado }
        "403": { description: No es tu archivo }
        "404": { description: No existe o ya estaba eliminado }

  /api/rutas:
    get:
      summary: Listar rutas públicas. Filtros - deporte_id, creador_id
      tags: [Rutas]
      security: []
      responses:
        "200": { description: Lista de rutas }
    post:
      summary: Crear una ruta propia, opcionalmente con sus puntos GPS (cualquier usuario autenticado)
      tags: [Rutas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, deporte_id]
              properties:
                nombre: { type: string, example: "Sendero del Bosque" }
                deporte_id: { type: integer, minimum: 1, example: 1 }
                dificultad: { type: string, enum: [facil, moderada, dificil, extrema], example: "moderada" }
                distancia_m: { type: integer, exclusiveMinimum: 0, example: 5000, description: "Metros, número entero mayor a 0." }
                desnivel_positivo_m: { type: integer, minimum: 0, example: 120 }
                gpx_archivo_id: { type: integer, minimum: 1, example: 1, description: "Opcional. Id de un archivo .gpx subido con POST /api/archivos." }
                puntos:
                  type: array
                  items:
                    type: object
                    required: [latitud, longitud]
                    properties:
                      tipo: { type: string, enum: [inicio, meta, hidratacion, punto_interes, mirador, peligro], example: "inicio", description: "Si se omite, se usa punto_interes." }
                      orden: { type: integer, example: 1, description: "No se puede repetir dentro de la misma ruta." }
                      latitud: { type: number, example: 19.4 }
                      longitud: { type: number, example: -99.1 }
      responses:
        "201": { description: Ruta creada }

  /api/rutas/{ruta_id}:
    get:
      summary: Detalle de una ruta con sus puntos
      tags: [Rutas]
      security: []
      parameters:
        - { name: ruta_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Ruta }
    put:
      summary: Editar mi ruta (dueño o admin)
      tags: [Rutas]
      parameters:
        - { name: ruta_id, in: path, required: true, schema: { type: integer, example: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, example: "Sendero del Bosque" }
                descripcion: { type: string, example: "Ruta de montaña de 5 km" }
                dificultad: { type: string, enum: [facil, moderada, dificil, extrema], example: "moderada" }
                distancia_m: { type: integer, exclusiveMinimum: 0, example: 5000 }
                desnivel_positivo_m: { type: integer, minimum: 0, example: 120 }
                es_publica: { type: boolean, example: true }
                gpx_archivo_id: { type: integer, minimum: 1, example: 1, description: "Id de un archivo .gpx subido con POST /api/archivos." }
      responses:
        "200": { description: Ruta actualizada }
        "403": { description: No tienes permisos sobre esta ruta }
    delete:
      summary: Eliminar mi ruta (borrado suave; dueño o admin)
      tags: [Rutas]
      parameters:
        - { name: ruta_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Ruta eliminada }

  /api/rutas/categorias/{categoria_id}/rutas:
    get:
      summary: Ver las rutas ligadas a una categoría de evento
      tags: [Rutas]
      security: []
      parameters:
        - { name: categoria_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Lista de rutas ligadas }
    post:
      summary: Ligar una ruta existente a una categoría de evento (solo admin)
      tags: [Rutas]
      parameters:
        - { name: categoria_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruta_id]
              properties:
                ruta_id: { type: integer }
      responses:
        "201": { description: Ruta ligada a la categoría }

  /api/eventos/{evento_id}/paquetes:
    get:
      summary: Listar paquetes de recuperación de un evento (público; ?incluir_inactivos=1 para admin)
      tags: [Inscripciones y valoraciones]
      security: []
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Lista de paquetes }
    post:
      summary: Crear un paquete de recuperación para un evento (solo admin)
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, example: "Kit básico" }
                nivel: { type: string }
                precio: { type: number }
      responses:
        "201": { description: Paquete creado }

  /api/inscripciones:
    post:
      summary: Inscribirme a una categoría de un evento (usuario autenticado)
      description: >
        El estado queda en "pendiente" (todavía no existe el módulo de pagos);
        si la categoría llegó a su cupo, cae en "lista_espera" cuando la
        categoría lo permite, o se rechaza con 409 si no.
      tags: [Inscripciones y valoraciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evento_id, fecha_id, categoria_id, boleto_id]
              properties:
                evento_id: { type: integer }
                fecha_id: { type: integer }
                categoria_id: { type: integer }
                boleto_id: { type: integer }
                paquete_id: { type: integer, nullable: true }
      responses:
        "201": { description: Inscripción creada }
        "409": { description: Ya inscrito en esa categoría, o cupo lleno sin lista de espera }

  /api/inscripciones/me:
    get:
      summary: Ver mis inscripciones (filtro opcional ?estado=)
      tags: [Inscripciones y valoraciones]
      responses:
        "200": { description: Lista de inscripciones del usuario autenticado }

  /api/inscripciones/{inscripcion_id}:
    get:
      summary: Detalle de una inscripción (dueño o admin)
