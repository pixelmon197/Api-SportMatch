                          properties:
                            desde: { type: string, format: date-time, example: "2026-10-19T14:30:00" }
                  total: { type: integer, example: 3 }
                  page: { type: integer, example: 1 }
                  per_page: { type: integer, example: 20 }
                  paginas: { type: integer, example: 1 }
        "403": { description: Perfil privado o solo para amigos }
        "404": { description: Perfil no encontrado }

  /api/amistades:
    get:
      summary: Mis amigos (amistades aceptadas)
      tags: [Amistades]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1, example: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20, example: 20 } }
