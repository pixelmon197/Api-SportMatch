        content:
          application/json:
            schema:
              type: object
              properties:
                inicia_en: { type: string, format: date-time, example: "2026-11-16T19:00:00" }
                termina_en: { type: string, format: date-time, example: "2026-11-16T22:00:00" }
                cancelada_en: { type: string, format: date-time, nullable: true, example: null }
      responses:
        "200": { description: Fecha actualizada }
    delete:
      summary: Eliminar una fecha
      tags: [Eventos]
      parameters:
        - { name: fecha_id, in: path, required: true, schema: { type: integer, example: 1 } }
