  /api/perfiles/me:
    get:
      summary: Mi usuario y mi perfil juntos (con mi ubicación y mis ajustes de privacidad)
      tags: [Perfiles]
      description: Si todavía no tenías perfil, se crea con los valores por defecto (perfil público, ubicación solo para amigos).
      responses:
        "200":
          description: Mi perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilCompleto" }
    put:
      summary: Editar mi perfil (biografía, avatar, portada y privacidad)
      tags: [Perfiles]
      description: >
        Todos los campos son opcionales, solo cambia lo que se mande. Con
        `null` en `biografia`, `avatar_id` o `portada_id` se borran. Los
        ids de imagen se obtienen con POST /api/archivos. Los datos de la
        cuenta (nombre, teléfono, ciudad, sexo) se editan en PUT /api/usuarios/me.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                biografia: { type: string, nullable: true, maxLength: 500, example: "Corro los fines de semana y me encanta el trail" }
                avatar_id: { type: integer, nullable: true, minimum: 1, example: 1, description: "Id de una imagen subida con POST /api/archivos." }
                portada_id: { type: integer, nullable: true, minimum: 1, example: 2, description: "Id de una imagen subida con POST /api/archivos." }
                visibilidad_perfil: { type: string, enum: [publico, amigos, privado], example: "publico", description: "Quién puede ver mi perfil." }
                visibilidad_ubicacion: { type: string, enum: [publico, amigos, privado], example: "amigos", description: "Quién puede ver mi ubicación." }
                quien_puede_escribir: { type: string, enum: [publico, amigos, privado], example: "publico", description: "Quién me puede escribir mensajes." }
                aparecer_en_cercanos: { type: boolean, example: true }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilCompleto" }
        "400": { description: Valor inválido (visibilidad, biografía muy larga, avatar/portada que no es una imagen existente) }

  /api/perfiles/me/ubicacion:
    put:
      summary: Guardar mi ubicación actual
      tags: [Perfiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitud, longitud]
              properties:
                latitud: { type: number, minimum: -90, maximum: 90, example: 19.2826 }
                longitud: { type: number, minimum: -180, maximum: 180, example: -99.6557 }
      responses:
        "200":
          description: Ubicación guardada (también se actualiza `ubicacion_actualizada_en`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilCompleto" }
        "400": { description: Faltan coordenadas, no son números o están fuera de rango }
    delete:
      summary: Borrar mi ubicación guardada
      tags: [Perfiles]
      responses:
        "200":
          description: Ubicación borrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilCompleto" }

  /api/perfiles/{usuario_id}:
    get:
      summary: Ver el perfil de otro usuario (respeta visibilidad, amistad y bloqueos)
      tags: [Perfiles]
      security: [{}, { bearerAuth: [] }]
      description: >
        Se puede consultar sin iniciar sesión si el perfil es público. Con
        token, además se reconoce a los amigos. 403 si el perfil es privado
        o solo para amigos; 404 si no existe, si la cuenta está suspendida o
        eliminada, o si hay un bloqueo entre ambos (en cualquier sentido, para
        no revelar que existe). El dueño y los administradores ven siempre todo.
      parameters:
        - { name: usuario_id, in: path, required: true, schema: { type: integer, example: 1 } }
      responses:
        "200":
          description: Perfil (el dueño o un admin recibe PerfilCompleto; los demás, PerfilPublico)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilPublico" }
        "403": { description: Perfil privado o solo para amigos }
        "404": { description: Perfil no encontrado }

  /api/perfiles/usuario/{nombre_usuario}:
    get:
      summary: Ver un perfil buscando por nombre de usuario (sin importar mayúsculas)
      tags: [Perfiles]
      security: [{}, { bearerAuth: [] }]
      description: Mismas reglas de visibilidad que GET /api/perfiles/{usuario_id}.
      parameters:
        - { name: nombre_usuario, in: path, required: true, schema: { type: string, example: "anaperez" } }
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerfilPublico" }
        "403": { description: Perfil privado o solo para amigos }
        "404": { description: Perfil no encontrado }

  /api/seguidores/{usuario_id}:
