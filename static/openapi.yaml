openapi: 3.0.3
info:
  title: Api-SportMatch
  description: >
    API REST de SportMatch. Fase 2: autenticación, usuarios y administradores.
    Fase 3 (en construcción): deportes, cuestionario de registro, eventos,
    inscripciones y valoraciones, organizadores y validación, administración
    y soporte. Ver /docs/entidades_completas.md en el repositorio para el
    catálogo completo de las 89 entidades del modelo.
  version: 0.5.0
servers:
  - url: https://api-sportmatch.onrender.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Usuario:
      type: object
      properties:
        id: { type: integer }
        nombre_completo: { type: string }
        correo: { type: string }
        nombre_usuario: { type: string }
        rol: { type: string, enum: [usuario, admin] }
        estado_cuenta: { type: string, enum: [activa, suspendida, eliminada] }
        telefono: { type: string }
        ciudad: { type: object, nullable: true }
        creado_en: { type: string, format: date-time }
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      summary: Estado del servicio
      tags: [Sistema]
      security: []
      responses:
        "200": { description: El servicio está activo }

  /api/auth/register:
    post:
      summary: Autoregistro (siempre crea rol "usuario")
      tags: [Autenticación]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_completo, nombre_usuario, correo, password]
              properties:
                nombre_completo: { type: string, example: "Ana Pérez" }
                nombre_usuario: { type: string, example: "anaperez" }
                correo: { type: string, example: "ana@correo.com" }
                password: { type: string, example: "MiClave123!" }
                telefono: { type: string }
                sexo: { type: string, enum: [masculino, femenino, otro, prefiero_no_decir] }
                fecha_nacimiento: { type: string, format: date, example: "2000-05-10" }
                ciudad_id: { type: integer }
      responses:
        "201": { description: Usuario creado, regresa access_token + usuario }
        "400": { description: Campos faltantes o inválidos (sexo, fecha_nacimiento) }
        "409": { description: Correo o nombre de usuario ya existen }

  /api/auth/login:
    post:
      summary: Iniciar sesión
      tags: [Autenticación]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, password]
              properties:
                correo: { type: string, example: "admin@sportmatch.com" }
                password: { type: string, example: "Admin123!" }
      responses:
        "200": { description: Login exitoso, regresa access_token + usuario }
        "401": { description: Credenciales inválidas }
        "403": { description: Cuenta suspendida o eliminada }

  /api/auth/olvide-contrasena:
    post:
      summary: Solicitar recuperación de contraseña (genera token de un solo uso)
      tags: [Autenticación]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo]
              properties:
                correo: { type: string, example: "ana@correo.com" }
      responses:
        "200":
          description: >
            Mensaje genérico (no revela si el correo existe). Si existe,
            incluye `token_reseteo` (temporal, solo para pruebas mientras
            no haya envío de correo real).
        "400": { description: correo faltante }

  /api/auth/restablecer-contrasena:
    post:
      summary: Cambiar la contraseña usando el token de /olvide-contrasena
      tags: [Autenticación]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, nueva_password]
              properties:
                token: { type: string }
                nueva_password: { type: string, example: "OtraClave456" }
      responses:
        "200": { description: Contraseña actualizada correctamente }
        "400": { description: Datos faltantes, token inválido, expirado o ya usado }
        "404": { description: Usuario no encontrado }

  /api/auth/me:
    get:
      summary: Datos del usuario autenticado
      tags: [Autenticación]
      responses:
        "200": { description: Usuario actual }

  /api/usuarios/me:
    put:
      summary: Actualizar mi propio perfil
      tags: [Usuarios]
      responses:
        "200": { description: Usuario actualizado }

  /api/usuarios/me/password:
    put:
      summary: Cambiar mi contraseña
      tags: [Usuarios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_actual, password_nueva]
              properties:
                password_actual: { type: string }
                password_nueva: { type: string }
      responses:
        "200": { description: Contraseña actualizada }
        "401": { description: Contraseña actual incorrecta }

  /api/usuarios:
    get:
      summary: Listar usuarios (solo admin)
      tags: [Administradores]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
        - name: rol
          in: query
          schema: { type: string, enum: [usuario, admin] }
        - name: estado_cuenta
          in: query
          schema: { type: string, enum: [activa, suspendida, eliminada] }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200": { description: Lista paginada de usuarios }
        "403": { description: No tienes permisos }

  /api/usuarios/{usuario_id}:
    get:
      summary: Obtener un usuario por id (solo admin)
      tags: [Administradores]
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Usuario encontrado }
        "404": { description: No existe }

  /api/usuarios/{usuario_id}/rol:
    put:
      summary: Cambiar el rol de un usuario (solo admin)
      tags: [Administradores]
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties:
                rol: { type: string, enum: [usuario, admin] }
      responses:
        "200": { description: Rol actualizado }
        "400": { description: Rol inválido }

  /api/usuarios/{usuario_id}/estado:
    put:
      summary: Activar, suspender o eliminar (borrado suave) un usuario (solo admin)
      tags: [Administradores]
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado_cuenta]
              properties:
                estado_cuenta: { type: string, enum: [activa, suspendida, eliminada] }
      responses:
        "200": { description: Estado actualizado }
        "400": { description: Estado inválido }

  /api/usuarios/admins:
    post:
      summary: Crear otro administrador (solo admin)
      tags: [Administradores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_completo, nombre_usuario, correo, password]
              properties:
                nombre_completo: { type: string }
                nombre_usuario: { type: string }
                correo: { type: string }
                password: { type: string }
      responses:
        "201": { description: Administrador creado }
        "409": { description: Correo o nombre de usuario ya existen }

  /api/deportes:
    get:
      summary: Listar catálogo de deportes (público; ?incluir_inactivos=1 para admin)
      tags: [Deportes]
      security: []
      responses:
        "200": { description: Lista de deportes }
    post:
      summary: Crear un deporte (solo admin)
      tags: [Deportes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, example: "Running" }
                categoria: { type: string, example: "resistencia" }
      responses:
        "201": { description: Deporte creado }
        "409": { description: Ya existe un deporte con ese nombre }

  /api/deportes/{deporte_id}:
    get:
      summary: Obtener un deporte
      tags: [Deportes]
      security: []
      parameters:
        - { name: deporte_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deporte encontrado }
    put:
      summary: Actualizar un deporte (solo admin)
      tags: [Deportes]
      parameters:
        - { name: deporte_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deporte actualizado }
    delete:
      summary: Desactivar un deporte (borrado suave, solo admin)
      tags: [Deportes]
      parameters:
        - { name: deporte_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deporte desactivado }

  /api/deportes/me:
    get:
      summary: Listar mis deportes
      tags: [Deportes]
      responses:
        "200": { description: Deportes del usuario autenticado }
    post:
      summary: Agregar un deporte a mi perfil
      tags: [Deportes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deporte_id]
              properties:
                deporte_id: { type: integer }
                nivel: { type: string, enum: [principiante, intermedio, avanzado, profesional] }
                es_principal: { type: boolean }
      responses:
        "201": { description: Deporte agregado }
        "409": { description: Ya tienes ese deporte registrado }

  /api/deportes/me/{deporte_id}:
    put:
      summary: Actualizar nivel / es_principal de uno de mis deportes
      tags: [Deportes]
      parameters:
        - { name: deporte_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Actualizado }
    delete:
      summary: Quitar un deporte de mi perfil
      tags: [Deportes]
      parameters:
        - { name: deporte_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Eliminado }

  /api/cuestionarios:
    get:
      summary: Listar cuestionarios (público; ?incluir_inactivos=1 para admin)
      tags: [Cuestionario de registro]
      security: []
      responses:
        "200": { description: Lista de cuestionarios }
    post:
      summary: Crear un cuestionario (solo admin)
      tags: [Cuestionario de registro]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, titulo]
              properties:
                codigo: { type: string, example: "registro_v1" }
                titulo: { type: string }
                descripcion: { type: string }
      responses:
        "201": { description: Cuestionario creado }

  /api/cuestionarios/{codigo}:
    get:
      summary: Obtener un cuestionario completo (preguntas + opciones) por su código
      tags: [Cuestionario de registro]
      security: []
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Cuestionario con preguntas y opciones anidadas }

  /api/cuestionarios/{cuestionario_id}/preguntas:
    post:
      summary: Agregar una pregunta a un cuestionario, opcionalmente con sus opciones (solo admin)
      tags: [Cuestionario de registro]
      parameters:
        - { name: cuestionario_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, texto]
              properties:
                codigo: { type: string }
                texto: { type: string }
                tipo: { type: string, enum: [opcion_unica, opcion_multiple, texto_libre, escala] }
                obligatoria: { type: boolean }
                opciones:
                  type: array
                  items:
                    type: object
                    properties:
                      texto: { type: string }
                      deporte_id: { type: integer }
      responses:
        "201": { description: Pregunta creada }

  /api/cuestionarios/{codigo}/responder:
    post:
      summary: Responder un cuestionario (usuario autenticado)
      tags: [Cuestionario de registro]
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuestas]
              properties:
                respuestas:
                  type: array
                  items:
                    type: object
                    properties:
                      pregunta_id: { type: integer }
                      opcion_id: { type: integer, nullable: true }
                      respuesta_texto: { type: string, nullable: true }
      responses:
        "201": { description: Respuestas guardadas }

  /api/cuestionarios/me/respuestas:
    get:
      summary: Ver mis respuestas
      tags: [Cuestionario de registro]
      responses:
        "200": { description: Respuestas del usuario autenticado }

  /api/eventos:
    get:
      summary: Listar eventos (público; por defecto solo estado=publicado). Filtros - Query params - estado, tipo, deporte_id, ciudad_id, q, page, per_page
      tags: [Eventos]
      security: []
      responses:
        "200": { description: Lista paginada de eventos }
    post:
      summary: Crear un evento, opcionalmente con deportes/requisitos/sedes/fechas/categorías+boletos anidados (solo admin)
      tags: [Eventos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, tipo]
              properties:
                titulo: { type: string }
                tipo: { type: string, example: "carrera" }
                dificultad: { type: string, enum: [principiante, intermedio, avanzado, elite] }
                descripcion: { type: string }
                deportes: { type: array, items: { type: integer } }
                requisitos:
                  type: array
                  items: { type: object, properties: { descripcion: { type: string }, orden: { type: integer } } }
                sedes:
                  type: array
                  items:
                    type: object
                    properties:
                      nombre: { type: string }
                      ciudad_id: { type: integer }
                      latitud: { type: number }
                      longitud: { type: number }
                fechas:
                  type: array
                  items: { type: object, properties: { inicia_en: { type: string, format: date-time }, termina_en: { type: string, format: date-time } } }
                categorias:
                  type: array
                  items:
                    type: object
                    properties:
                      nombre: { type: string }
                      distancia_km: { type: number }
                      cupo_total: { type: integer }
                      boletos:
                        type: array
                        items: { type: object, properties: { tipo: { type: string }, precio: { type: number } } }
      responses:
        "201": { description: Evento creado (borrador) con todo lo anidado }

  /api/eventos/{evento_id}:
    get:
      summary: Detalle de un evento (con deportes/requisitos/sedes/fechas/categorías/boletos)
      tags: [Eventos]
      security: []
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Evento }
    put:
      summary: Actualizar un evento, incl. cambiar `estado` (borrador/publicado/cancelado/finalizado) (solo admin)
      tags: [Eventos]
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Evento actualizado }
    delete:
      summary: Eliminar un evento (borrado suave, solo admin)
      tags: [Eventos]
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Evento marcado como cancelado/eliminado }

  /api/eventos/slug/{slug}:
    get:
      summary: Detalle de un evento por su slug
      tags: [Eventos]
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento }

  /api/eventos/{evento_id}/categorias:
    post:
      summary: Agregar una categoría a un evento existente (solo admin)
      tags: [Eventos]
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      responses:
        "201": { description: Categoría creada }

  /api/eventos/categorias/{categoria_id}/boletos:
    post:
      summary: Agregar un tipo de boleto a una categoría (solo admin)
      tags: [Eventos]
      parameters:
        - { name: categoria_id, in: path, required: true, schema: { type: integer } }
      responses:
        "201": { description: Boleto creado }

  /api/rutas:
    get:
      summary: Listar rutas públicas. Filtros - deporte_id, creador_id
      tags: [Rutas]
      security: []
      responses:
        "200": { description: Lista de rutas }
    post:
      summary: Crear una ruta propia, opcionalmente con sus puntos GPS (cualquier usuario autenticado)
      tags: [Rutas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, deporte_id]
              properties:
                nombre: { type: string }
                deporte_id: { type: integer }
                distancia_m: { type: number }
                puntos:
                  type: array
                  items:
                    type: object
                    properties:
                      tipo: { type: string, enum: [inicio, fin, control, paso] }
                      latitud: { type: number }
                      longitud: { type: number }
      responses:
        "201": { description: Ruta creada }

  /api/rutas/{ruta_id}:
    get:
      summary: Detalle de una ruta con sus puntos
      tags: [Rutas]
      security: []
      parameters:
        - { name: ruta_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Ruta }
    put:
      summary: Editar mi ruta (dueño o admin)
      tags: [Rutas]
      parameters:
        - { name: ruta_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Ruta actualizada }
        "403": { description: No tienes permisos sobre esta ruta }
    delete:
      summary: Eliminar mi ruta (borrado suave; dueño o admin)
      tags: [Rutas]
      parameters:
        - { name: ruta_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Ruta eliminada }

  /api/rutas/categorias/{categoria_id}/rutas:
    get:
      summary: Ver las rutas ligadas a una categoría de evento
      tags: [Rutas]
      security: []
      parameters:
        - { name: categoria_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Lista de rutas ligadas }
    post:
      summary: Ligar una ruta existente a una categoría de evento (solo admin)
      tags: [Rutas]
      parameters:
        - { name: categoria_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruta_id]
              properties:
                ruta_id: { type: integer }
      responses:
        "201": { description: Ruta ligada a la categoría }

  /api/eventos/{evento_id}/paquetes:
    get:
      summary: Listar paquetes de recuperación de un evento (público; ?incluir_inactivos=1 para admin)
      tags: [Inscripciones y valoraciones]
      security: []
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Lista de paquetes }
    post:
      summary: Crear un paquete de recuperación para un evento (solo admin)
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, example: "Kit básico" }
                nivel: { type: string }
                precio: { type: number }
      responses:
        "201": { description: Paquete creado }

  /api/inscripciones:
    post:
      summary: Inscribirme a una categoría de un evento (usuario autenticado)
      description: >
        El estado queda en "pendiente" (todavía no existe el módulo de pagos);
        si la categoría llegó a su cupo, cae en "lista_espera" cuando la
        categoría lo permite, o se rechaza con 409 si no.
      tags: [Inscripciones y valoraciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evento_id, fecha_id, categoria_id, boleto_id]
              properties:
                evento_id: { type: integer }
                fecha_id: { type: integer }
                categoria_id: { type: integer }
                boleto_id: { type: integer }
                paquete_id: { type: integer, nullable: true }
      responses:
        "201": { description: Inscripción creada }
        "409": { description: Ya inscrito en esa categoría, o cupo lleno sin lista de espera }

  /api/inscripciones/me:
    get:
      summary: Ver mis inscripciones (filtro opcional ?estado=)
      tags: [Inscripciones y valoraciones]
      responses:
        "200": { description: Lista de inscripciones del usuario autenticado }

  /api/inscripciones/{inscripcion_id}:
    get:
      summary: Detalle de una inscripción (dueño o admin)
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: inscripcion_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Inscripción }
        "403": { description: No tienes acceso a esta inscripción }

  /api/inscripciones/{inscripcion_id}/cancelar:
    put:
      summary: Cancelar una inscripción (dueño o admin). Si había lista de espera, sube al siguiente.
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: inscripcion_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Inscripción cancelada }

  /api/inscripciones/{inscripcion_id}/estado:
    put:
      summary: Cambiar el estado de una inscripción a mano (solo admin, mientras no exista el módulo de pagos)
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: inscripcion_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [pendiente, confirmada, lista_espera, cancelada, completada] }
      responses:
        "200": { description: Estado actualizado }

  /api/inscripciones/{inscripcion_id}/resultado:
    put:
      summary: Registrar asistencia y resultado el día del evento (solo admin)
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: inscripcion_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asistio: { type: boolean }
                asistencia_latitud: { type: number }
                asistencia_longitud: { type: number }
                tiempo_oficial: { type: string, example: "00:28:15" }
                posicion_general: { type: integer }
                posicion_categoria: { type: integer }
                numero_participante: { type: string }
                completada: { type: boolean }
      responses:
        "200": { description: Inscripción actualizada }

  /api/eventos/{evento_id}/inscripciones:
    get:
      summary: Ver quién se inscribió a un evento (solo admin). Filtros - categoria_id, estado
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Lista de inscripciones del evento }

  /api/inscripciones/{inscripcion_id}/valoracion:
    post:
      summary: Valorar el evento tras asistir (solo si la inscripción está "completada"; usuario dueño)
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: inscripcion_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calificacion_evento]
              properties:
                calificacion_evento: { type: integer, minimum: 1, maximum: 5 }
                calificacion_organizador: { type: integer, minimum: 1, maximum: 5 }
                comentario: { type: string }
      responses:
        "201": { description: Valoración guardada (crea o actualiza) }
        "400": { description: La inscripción todavía no está "completada" }

  /api/eventos/{evento_id}/valoraciones:
    get:
      summary: Ver las valoraciones públicas de un evento
      tags: [Inscripciones y valoraciones]
      security: []
      parameters:
        - { name: evento_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Lista de valoraciones }

  /api/valoraciones/{valoracion_id}/responder:
    put:
      summary: Responder públicamente a una valoración (organizador; por ahora, admin)
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: valoracion_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuesta_organizador]
              properties:
                respuesta_organizador: { type: string }
      responses:
        "200": { description: Respuesta guardada }

  /api/usuarios/me/calendario:
    get:
      summary: Ver las fechas de eventos que guardé en mi calendario
      tags: [Inscripciones y valoraciones]
      responses:
        "200": { description: Lista de fechas guardadas }
    post:
      summary: Agregar una fecha de evento a mi calendario
      tags: [Inscripciones y valoraciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha_id]
              properties:
                fecha_id: { type: integer }
      responses:
        "201": { description: Agregado al calendario }

  /api/usuarios/me/calendario/{fecha_id}:
    delete:
      summary: Quitar una fecha de mi calendario
      tags: [Inscripciones y valoraciones]
      parameters:
        - { name: fecha_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Eliminado }

  /api/organizadores:
    get:
      summary: Listar organizadores (público; solo aprobados. ?estado_validacion= para admin)
      tags: [Organizadores]
      security: []
      responses:
        "200": { description: Lista de organizadores }
    post:
      summary: Crear mi perfil de organizador (autenticado; uno por usuario, queda "pendiente")
      tags: [Organizadores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_comercial]
              properties:
                nombre_comercial: { type: string }
                descripcion: { type: string }
                correo_contacto: { type: string }
                telefono_contacto: { type: string }
                ciudad_id: { type: integer }
      responses:
        "201": { description: Organizador creado }
        "409": { description: Ya tienes un perfil de organizador }

  /api/organizadores/{organizador_id}:
    get:
      summary: Detalle de un organizador
      tags: [Organizadores]
      security: []
      parameters:
        - { name: organizador_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Organizador }
    put:
      summary: Editar mi organizador (miembro propietario/administrador, o admin)
      tags: [Organizadores]
      parameters:
        - { name: organizador_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Organizador actualizado }

  /api/organizadores/{organizador_id}/miembros:
    post:
      summary: Agregar un miembro al equipo del organizador
      tags: [Organizadores]
      parameters:
        - { name: organizador_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario_id]
              properties:
                usuario_id: { type: integer }
                rol: { type: string, enum: [propietario, administrador, editor] }
      responses:
        "201": { description: Miembro agregado }

  /api/organizadores/{organizador_id}/solicitudes:
    post:
      summary: Enviar el organizador a revisión, opcionalmente con documentos anexos
      tags: [Organizadores]
      parameters:
        - { name: organizador_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentos:
                  type: array
                  items:
                    type: object
                    properties:
                      tipo_documento: { type: string, example: "ine" }
                      numero_documento: { type: string }
      responses:
        "201": { description: Solicitud enviada (organizador pasa a "en_revision") }
        "409": { description: Ya hay una solicitud pendiente }

  /api/organizadores/solicitudes:
    get:
      summary: Bandeja de solicitudes de validación (solo admin; ?estado=pendiente por defecto)
      tags: [Organizadores]
      responses:
        "200": { description: Lista de solicitudes }

  /api/organizadores/solicitudes/{solicitud_id}/revisar:
    put:
      summary: Aprobar o rechazar una solicitud de validación (solo admin)
      tags: [Organizadores]
      parameters:
        - { name: solicitud_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [aprobar, rechazar] }
                comentarios: { type: string }
                motivo_rechazo: { type: string }
      responses:
        "200": { description: Organizador y solicitud actualizados }

  /api/reportes:
    post:
      summary: Reportar contenido o a un usuario (tipo_entidad/entidad_id son genéricos)
      tags: [Administración y soporte]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo_entidad, entidad_id, motivo]
              properties:
                tipo_entidad: { type: string, example: "evento" }
                entidad_id: { type: integer }
                motivo: { type: string }
                descripcion: { type: string }
      responses:
        "201": { description: Reporte creado }
    get:
      summary: Bandeja de moderación (solo admin; ?estado=pendiente por defecto)
      tags: [Administración y soporte]
      responses:
        "200": { description: Lista de reportes }

  /api/reportes/{reporte_id}:
    put:
      summary: Moderar un reporte (solo admin) — se registra en la bitácora de auditoría
      tags: [Administración y soporte]
      parameters:
        - { name: reporte_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { type: string, enum: [pendiente, en_revision, resuelto, desestimado] }
                accion_tomada: { type: string }
                notas_moderador: { type: string }
      responses:
        "200": { description: Reporte actualizado }

  /api/tickets:
    post:
      summary: Abrir un ticket de soporte con el mensaje inicial
      tags: [Administración y soporte]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asunto, mensaje]
              properties:
                asunto: { type: string }
                mensaje: { type: string }
                categoria: { type: string }
                prioridad: { type: string, enum: [baja, media, alta, urgente] }
      responses:
        "201": { description: Ticket creado }
    get:
      summary: Bandeja de soporte (solo admin; filtros estado, prioridad, asignado_a)
      tags: [Administración y soporte]
      responses:
        "200": { description: Lista de tickets }

  /api/tickets/{ticket_id}:
    get:
      summary: Detalle de un ticket con sus mensajes (dueño no ve mensajes internos)
      tags: [Administración y soporte]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Ticket con mensajes }
    put:
      summary: Asignar, priorizar o cerrar un ticket (solo admin)
      tags: [Administración y soporte]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Ticket actualizado }

  /api/tickets/{ticket_id}/mensajes:
    post:
      summary: Agregar un mensaje al ticket (dueño o admin; solo admin puede marcarlo es_interno)
      tags: [Administración y soporte]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mensaje]
              properties:
                mensaje: { type: string }
                es_interno: { type: boolean }
      responses:
        "201": { description: Mensaje agregado }

  /api/admin/auditoria:
    get:
      summary: Bitácora de auditoría de solo lectura (solo admin)
      tags: [Administración y soporte]
      parameters:
        - { name: tipo_entidad, in: query, schema: { type: string } }
        - { name: entidad_id, in: query, schema: { type: integer } }
        - { name: usuario_id, in: query, schema: { type: integer } }
      responses:
        "200": { description: Lista paginada de registros de auditoría }
